joystick_driver:

  twist_topic: {
    type: string,
    default_value: "cmd_vel",
    description: "The topic to publish the Twist messages to"
  }

  stamped_topic: {
    type: string,
    default_value: "",
    description: "The topic to publish the TwistStamped messages to. Defaults to `twist_topic/stamped`, basically just adds `/stamped` to the normal twist topic"
  }

  twist_type: {
    type: string,
    default_value: "both",
    description: "Set to 'stamped' to publish only Twiststamped on `twist_topic`, 'unstamped' to publish only Twist on `twist_topic`, and 'both' to publish both Twist and TwistStamped on `twist_topic` and `twist_topic/stamped` respectively"
  }

  joystick_type: {
    type: string,
    default_value: "none",
    description: "The type of mapping to use. Implemented ones are `ps4`, `gamesir`, `xbox`, and `switch`"
  }

  twist_frame_id: {
    type: string,
    default_value: "base_link",
    description: "The name of the frame_id to use for the header of the TwistStamped message"
  }

  publish_rate: {
    type: int,
    default_value: 50,
    description: "The rate at which to publish the twist topics, in Hz" 
  }

  max_tangential_velocity: {
    type: double,
    default_value: 1.0,
    description: "The max magnitude of the `Twist.linear.x` component" 
  }

  max_angular_velocity: {
    type: double,
    default_value: 1.0,
    description: "The max magnitude of the `Twist.angular.z` component" 
  }

  # ==============================
  # GAMEPAD BINDINGS
  # ==============================

  # Thumbstick axes
  stick_left_x: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Left Stick X axis of a controller"
  }

  stick_left_y: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Left Stick Y axis of a controller"
  }

  stick_right_x: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Right Stick X axis of a controller"
  }

  stick_right_y: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Right Stick Y axis of a controller"
  }

  # Triggers as buttons (optional)
  button_trigger_left: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Left Trigger button of a controller"
  }

  button_trigger_right: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Right Trigger button of a controller"
  }

  # Triggers as axes (optional)
  axis_trigger_left: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Left Trigger axis of a controller"
  }

  axis_trigger_right: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Right Trigger axis of a controller"
  }

  # Bumper Buttons
  bumper_left: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Left Bumper button of a controller"
  }

  bumper_right: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Right Bumper button of a controller"
  }

  # Face Buttons
  button_down: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Down button of a controller"
  }

  button_right: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Right button of a controller"
  }

  button_left: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Left button of a controller"
  }

  button_up: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Up button of a controller"
  }

  # Thumbstick Buttons
  button_left_stick: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Left Stick button of a controller"
  }

  button_right_stick: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Right Stick button of a controller"
  }

  # DPAD as buttons (optional)
  button_dpad_up: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the D-Pad Up button of a controller"
  }

  button_dpad_down: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the D-Pad Down button of a controller"
  }

  button_dpad_left: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the D-Pad Left button of a controller"
  }

  button_dpad_right: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the D-Pad Right button of a controller"
  }

  # DPAD as axes (optional)
  axis_dpad_x: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the D-Pad X axis of a controller"
  }

  axis_dpad_y: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the D-Pad Y axis of a controller"
  }

  # Home Button
  button_home: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Home button of a controller"
  }

  button_settings: {
    type: int,
    default_value: -1,
    description: "The index in the `joy_msg` for the Settings button of a controller"
  }